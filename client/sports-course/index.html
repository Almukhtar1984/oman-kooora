<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0891b2" />
    <meta name="description" content="منصة طموح — إدارة الدورات والبطولات" />
    <link rel="manifest" href="/manifest.json" />
    <title>طموح</title>
    <style>
      html, body { background: #f8fafc; margin: 0; }
      #initial-splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: linear-gradient(135deg, #06b6d4 0%, #22d3ee 100%);
        color: #fff;
        font-family: 'Cairo', system-ui, -apple-system, 'Segoe UI', sans-serif;
        z-index: 9999;
        opacity: 1;
        transition: opacity .35s ease-out;
      }
      #initial-splash.hide { opacity: 0; pointer-events: none; }
      .splash-mark {
        width: 64px; height: 64px; border-radius: 16px;
        background: rgba(255,255,255,0.16);
        display: flex; align-items: center; justify-content: center;
        font-weight: 700; font-size: 22px; letter-spacing: .5px;
        backdrop-filter: blur(8px);
      }
      .splash-title { font-size: 18px; font-weight: 700; opacity: .95; }
      .splash-subtitle { font-size: 12px; opacity: .8; }
      .splash-bar {
        width: 180px; height: 3px; border-radius: 3px;
        background: rgba(255,255,255,0.25);
        overflow: hidden; margin-top: 6px;
      }
      .splash-bar::after {
        content: ""; display: block; height: 100%; width: 40%;
        background: #fff; border-radius: 3px;
        animation: splashbar 1.1s cubic-bezier(.45,.05,.55,.95) infinite;
      }
      @keyframes splashbar {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(450%); }
      }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="initial-splash" aria-label="جاري التحميل">
      <div class="splash-mark">ط</div>
      <div class="splash-title">منصة طموح</div>
      <div class="splash-subtitle">جاري تحميل لوحة الدورات…</div>
      <div class="splash-bar"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
    <script>
      window.__hideSplash = function () {
        var s = document.getElementById('initial-splash');
        if (!s) return;
        s.classList.add('hide');
        setTimeout(function(){ s && s.parentNode && s.parentNode.removeChild(s); }, 400);
      };
    </script>
  </body>
</html>
