name: Server Checks

on:
  pull_request:
    paths:
      - "omkoora-backend--main/**"
      - ".github/workflows/server-checks.yml"

jobs:
  server-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: omkoora-backend--main/package-lock.json

      - name: Install server dependencies
        working-directory: omkoora-backend--main
        run: npm ci

      - name: Check changed server syntax
        run: |
          files=$(git diff --name-only origin/${{ github.base_ref }}...HEAD -- omkoora-backend--main | grep '\.mjs$' || true)
          if [ -n "$files" ]; then
            echo "$files" | xargs node --check
          fi

      - name: Loan flow guards
        working-directory: omkoora-backend--main
        run: npm run test:loan-flow

      - name: Participating player search guards
        working-directory: omkoora-backend--main
        run: npm run test:player-search
