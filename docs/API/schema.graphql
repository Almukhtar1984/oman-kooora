# ============================================================================
#  Tomoh / omkooora GraphQL API — root schema
#  Endpoint (prod): https://api.omkooora.com/graphql
#  Auth: send an access token in the "Authorization" header. Fields marked
#        @auth(requires: ...) need a valid token; fields without it are public.
# ============================================================================

directive @date(format: String = "dd/mm/yyyy HH:MM:ss") on FIELD_DEFINITION
directive @auth(requires: Role = user) on OBJECT | FIELD_DEFINITION
directive @imgUrl on FIELD_DEFINITION

scalar Date
scalar Upload
scalar Time

type File { filename: String!  url: String! }
type Files { filesname: [String!]  url: String! }

enum Role { admin employee supervisor customer user }
enum Gander { male female }
enum Activation { Active Desactive }

type Query { _empty: String }
type Mutation {
    _empty: String
    singleUpload(file: Upload): File @auth(requires: user)
}

type statusUpdate { status: Boolean }
type statusDelete { status: Boolean }
type bulkStatusResult { success: Int  total: Int }

# ===================== typeActionLogs =====================
extend type Query {
  ActionLog(id: ID!): ActionLog @auth(requires: user)
  allActionLogs: [ActionLog!] @auth(requires: user)
  allActionLogsClub(idClub: ID!): [ActionLog!] @auth(requires: user)
}

type ActionLog {
  id: ID!
  id_player: ID
  level: String
  action_name: String
  success: String
  user: User
  entity_type: String
  entity_id: ID
  action_type: ActionType
  action_variables: String
  team: Team
  createdAt: Date @date(format: "dd/MM/yyyy HH:mm:ss")
  updatedAt: Date @date(format: "dd/MM/yyyy HH:mm:ss")
  deletedAt: Date @date(format: "dd/MM/yyyy HH:mm:ss")
}

enum ActionType {
  Create
  Update
  Delete
}

type statusDelete {
  success: Boolean!
  message: String
}

# ===================== Assembly =====================
extend type Query {
  assembly(id: ID): Assembly
  allAssemblyClub(idClub: ID): [Assembly!]
  allAssemblyTeam(idTeam: ID): [Assembly!]
}

extend type Mutation {
  createAssembly(content: contentAssembly!): Assembly! @auth(requires: user)
  updateAssembly(id: ID!, content: contentAssembly!): statusUpdate @auth(requires: user)
  deleteAssembly(id: ID!): statusDelete @auth(requires: user)
}

type Assembly {
  id: ID
  personal_picture: String
  first_name: String
  second_name: String
  third_name: String
  tribe: String
  date_birth: Date @date(format: "yyyy-MM-dd")
  card_number: String
  phone: String
  type: String
  club: Club
  team: Team
  nationalID: String
  nationalIDBack: String
  membership_date: Date @date(format: "yyyy-MM-dd")
  gender: Gander
  subscription_date: Date @date(format: "yyyy-MM-dd")
  createdAt: Date @date(format: "yyyy-MM-dd HH:mm:ss")
  updatedAt: Date @date(format: "yyyy-MM-dd HH:mm:ss")
  deletedAt: Date @date(format: "yyyy-MM-dd HH:mm:ss")
}

input contentAssembly {
  personal_picture: Upload
  oldPersonalPicture: String
  first_name: String
  second_name: String
  third_name: String
  tribe: String
  date_birth: String
  card_number: String
  phone: String
  type: String
  nationalID: Upload
  nationalIDBack: Upload
  oldNationalID: String
  oldNationalIDBack: String
  membership_date: String
  gender: Gander
  subscription_date: String
  id_club: ID
  id_team: ID
}

